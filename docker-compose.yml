name: vlogbuddy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # MinIO publishes to quay.io, not Docker Hub.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      # Makes presigned URLs and redirects use the public hostname.
      MINIO_BROWSER_REDIRECT_URL: ${PUBLIC_STORAGE_URL}
      # Browsers PUT directly to MinIO via presigned URLs, so the app origin
      # must be allowed. MinIO doesn't implement the S3 PutBucketCors API —
      # this env var is the supported way to configure it.
      # Set CORS_ALLOW_ORIGIN=* when accessing by IP (no domain), otherwise
      # the browser Origin won't match PUBLIC_BASE_URL and uploads fail.
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-${PUBLIC_BASE_URL}}
    volumes:
      - ./data/minio:/data
    ports:
      # Your reverse proxy should forward PUBLIC_STORAGE_URL here.
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        # The bucket stays private: all access is via expiring presigned URLs.
        echo "minio-init: bucket '$$S3_BUCKET' ready"
    restart: "no"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      PUBLIC_STORAGE_URL: ${PUBLIC_STORAGE_URL}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-}
      S3_PORT: ${S3_PORT:-9000}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_PRESIGN_EXPIRY: ${S3_PRESIGN_EXPIRY}
      SESSION_SECRET: ${SESSION_SECRET}
      # Guards /admin and vlog creation. Empty means the admin area is sealed.
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB}
      PORT: 3000
    ports:
      # Your reverse proxy should forward PUBLIC_BASE_URL here.
      # WebSocket upgrade must be enabled for live voting + co-editing.
      - "${WEB_PORT:-3000}:3000"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      # Unseals stored Immich API keys — must match the web service.
      SESSION_SECRET: ${SESSION_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY}
      RENDER_HEIGHT: ${RENDER_HEIGHT}
      RENDER_FPS: ${RENDER_FPS}
    volumes:
      - ./data/worker-tmp:/tmp/vlogbuddy
